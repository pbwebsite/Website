<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write Article | PB Performance Coaching</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1c20;--surface:#121f25;--card:#182630;
  --border:#25383f;--teal:#3a8fa2;--teal-b:#4db8d0;
  --text:#dde8ea;--muted:#7dabb4;--dim:#3d6470;--danger:#e05252;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* LOGIN */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login.hidden{display:none}
.card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--teal);border-radius:16px;padding:2.8rem 2.4rem;width:100%;max-width:400px}
.card-logo{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem}
.card-logo img{width:40px;height:40px;border-radius:8px}
.card-logo-name{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.card-logo-sub{font-size:.55rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card h1{font-size:1.5rem;font-weight:900;letter-spacing:-.025em;margin-bottom:.4rem}
.card p{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:1.8rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field label{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.field input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.92rem;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--teal)}
.btn{width:100%;padding:.9rem;background:linear-gradient(135deg,#3e9db1,#25768a);color:#fff;font-size:.9rem;font-weight:800;letter-spacing:.04em;border:none;border-radius:8px;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn:hover:not(:disabled){background:linear-gradient(135deg,#52c1d8,#3a8fa2)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{font-size:.78rem;color:var(--danger);margin-top:.6rem;min-height:1.1em}

/* EDITOR */
.editor{display:none;flex-direction:column;height:100vh}
.editor.visible{display:flex}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.25rem;background:rgba(13,28,32,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;gap:1rem}
.topbar-left{display:flex;align-items:center;gap:.8rem}
.topbar-left img{width:34px;height:34px;border-radius:6px}
.badge{font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-b);background:rgba(77,184,208,.1);border:1px solid rgba(77,184,208,.25);padding:.2rem .65rem;border-radius:20px}
.topbar-right{display:flex;align-items:center;gap:.6rem}
.link-btn{font-size:.72rem;font-weight:700;color:var(--dim);background:none;border:none;cursor:pointer;text-decoration:none;transition:color .15s}
.link-btn:hover{color:var(--muted)}
.pub-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.52rem 1.3rem;background:linear-gradient(135deg,#3e9db1,#25768a);color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.06em;border:none;border-radius:7px;cursor:pointer;box-shadow:0 2px 10px rgba(58,143,162,.3);transition:background .2s,transform .15s}
.pub-btn:hover:not(:disabled){background:linear-gradient(135deg,#52c1d8,#3a8fa2);transform:translateY(-1px)}
.pub-btn:disabled{opacity:.5;cursor:not-allowed}
.pub-btn.loading{position:relative;color:transparent}
.pub-btn.loading::after{content:'';position:absolute;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;top:50%;left:50%;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.title-bar{padding:.9rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.title-input{width:100%;background:none;border:none;outline:none;font-size:1.5rem;font-weight:900;letter-spacing:-.025em;color:var(--text);font-family:inherit}
.title-input::placeholder{color:var(--dim)}

.toolbar{display:flex;align-items:center;gap:.2rem;padding:.5rem .9rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;background:none;border:none;border-radius:5px;color:var(--muted);cursor:pointer;font-size:.75rem;font-weight:800;transition:color .15s,background .15s;font-family:inherit}
.tb:hover{color:var(--text);background:rgba(255,255,255,.07)}
.tb.img-btn{cursor:pointer}
.tb.uploading{color:var(--teal-b)!important;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.sep{width:1px;height:18px;background:var(--border);margin:0 .25rem;flex-shrink:0}
#imgInput{display:none}

.panes{display:flex;flex:1;min-height:0}
.write{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.preview{flex:1;min-width:0;overflow-y:auto}
.preview.hidden{display:none}

textarea{flex:1;resize:none;width:100%;background:var(--bg);border:none;outline:none;color:var(--text);font-size:.95rem;font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.85;padding:1.5rem;-webkit-font-smoothing:antialiased}
textarea::placeholder{color:var(--dim)}

/* PREVIEW — mirrors pb-article.html */
.prev-wrap{padding:2rem 1.5rem 4rem;max-width:680px}
.prev-date{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:.75rem}
.prev-title{font-size:clamp(1.4rem,2.5vw,2rem);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.4rem;color:var(--text);text-wrap:balance}
.prev-title.empty{color:var(--dim);font-weight:500;font-style:italic;letter-spacing:0}
.prev-author{display:flex;align-items:center;gap:.9rem;margin-bottom:2rem;padding-bottom:1.8rem;border-bottom:1px solid var(--border)}
.prev-author img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--teal);flex-shrink:0}
.prev-author-name{font-size:.8rem;font-weight:800}
.prev-author-role{font-size:.6rem;color:var(--dim);margin-top:.1rem}
.art-body{font-size:1rem;color:var(--muted);line-height:1.85}
.art-body p{margin:.9rem 0}
.art-body h2{font-size:1.35rem;font-weight:900;color:var(--text);letter-spacing:-.025em;margin:2.2rem 0 .65rem;line-height:1.2}
.art-body h3{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.015em;margin:1.8rem 0 .5rem}
.art-body strong{color:var(--text);font-weight:700}
.art-body em{font-style:italic}
.art-body a{color:var(--teal-b);text-decoration:underline;text-underline-offset:3px}
.art-body ul,.art-body ol{padding-left:1.4rem;margin:.8rem 0;display:flex;flex-direction:column;gap:.35rem}
.art-body li{line-height:1.7}
.art-body blockquote{border-left:3px solid var(--teal);padding:.5rem 1.1rem;color:var(--muted);font-style:italic;margin:1.4rem 0;background:rgba(58,143,162,.05);border-radius:0 8px 8px 0}
.art-body hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
.art-body img{max-width:100%;border-radius:10px;margin:1.5rem 0;display:block}
.art-body pre{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:1.2rem;overflow-x:auto;margin:1.2rem 0;font-size:.84rem}
.art-body code{background:rgba(255,255,255,.06);padding:.15em .4em;border-radius:4px;font-size:.87em}
.art-body pre code{background:none;padding:0}
.prev-empty{color:var(--dim);font-size:.88rem;font-style:italic}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.4rem;font-size:.82rem;font-weight:700;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9999;transition:transform .3s var(--ease),opacity .3s;opacity:0;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:rgba(58,143,162,.5);color:var(--teal-b)}
.toast.err{border-color:rgba(224,82,82,.4);color:var(--danger)}

@media(max-width:640px){.preview{display:none!important}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="card">
    <div class="card-logo">
      <img src="images/logo.jpg" alt="PB">
      <div>
        <div class="card-logo-name">PB Performance</div>
        <div class="card-logo-sub">Article Editor</div>
      </div>
    </div>
    <h1>Write an Article</h1>
    <p>Enter your password to start writing.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwInput" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Sign In →</button>
    <p class="error" id="loginErr"></p>
  </div>
</div>

<div class="editor" id="editor">
  <div class="topbar">
    <div class="topbar-left">
      <img src="images/logo.jpg" alt="PB">
      <span class="badge">Article Editor</span>
    </div>
    <div class="topbar-right">
      <a class="link-btn" href="pb-articles.html" target="_blank">View Site</a>
      <button class="link-btn" onclick="logout()">Log out</button>
      <button class="pub-btn" id="pubBtn" onclick="publish()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Publish
      </button>
    </div>
  </div>

  <div class="title-bar">
    <input class="title-input" id="titleInput" placeholder="Article title…" autocomplete="off" oninput="renderPreview()">
  </div>

  <div class="toolbar">
    <button class="tb" onclick="wrap('**','**')"><strong>B</strong></button>
    <button class="tb" onclick="wrap('*','*')"><em>I</em></button>
    <div class="sep"></div>
    <button class="tb" onclick="prefix('## ')">H2</button>
    <button class="tb" onclick="prefix('### ')">H3</button>
    <div class="sep"></div>
    <button class="tb" onclick="prefix('- ')">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="tb" onclick="prefix('> ')">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18"/></svg>
    </button>
    <button class="tb" onclick="prefix('---')" style="letter-spacing:-.05em">—</button>
    <div class="sep"></div>
    <label class="tb img-btn" id="imgBtn" title="Upload image">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <input type="file" id="imgInput" accept="image/*" onchange="uploadImg(this)">
    </label>
    <div class="sep"></div>
    <button class="tb" id="prevToggle" onclick="togglePreview()" style="width:auto;padding:0 .6rem;font-size:.65rem;letter-spacing:.06em;color:var(--teal-b)">Preview</button>
  </div>

  <div class="panes">
    <div class="write"><textarea id="body" placeholder="Start writing…&#10;&#10;Use ## for headings, **bold**, *italic*" oninput="renderPreview()" spellcheck="true"></textarea></div>
    <div class="preview" id="preview">
      <div class="prev-wrap">
        <div class="prev-date">Draft preview</div>
        <div class="prev-title empty" id="prevTitle">Article title…</div>
        <div class="prev-author">
          <img src="images/paddy-bench.jpg" alt="Paddy Burke" onerror="this.style.display='none'">
          <div>
            <div class="prev-author-name">Paddy Burke</div>
            <div class="prev-author-role">MSc Performance Coaching · Antrim Senior Hurler</div>
          </div>
        </div>
        <div class="art-body" id="prevBody"><p class="prev-empty">Start writing to see a preview…</p></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const pw = () => sessionStorage.getItem('pb_pw') || '';
const api = (data) => fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw(), ...data }) });

// ── AUTH ──────────────────────────────────────────────────────────────────────

async function login() {
  const val = document.getElementById('pwInput').value;
  if (!val) return;
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Checking…'; btn.disabled = true;
  document.getElementById('loginErr').textContent = '';
  try {
    const res = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: val }) });
    if (res.status === 401) { document.getElementById('loginErr').textContent = 'Wrong password — try again.'; return; }
    if (!res.ok) { document.getElementById('loginErr').textContent = 'Server error — try again.'; return; }
    sessionStorage.setItem('pb_pw', val);
    showEditor();
  } catch { document.getElementById('loginErr').textContent = 'Could not connect — try again.'; }
  finally { btn.textContent = 'Sign In →'; btn.disabled = false; }
}

function logout() {
  if (!confirm('Log out?')) return;
  sessionStorage.removeItem('pb_pw');
  location.reload();
}

function showEditor() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('editor').classList.add('visible');
  document.getElementById('titleInput').focus();
}

// ── PUBLISH ───────────────────────────────────────────────────────────────────

async function publish() {
  const title = document.getElementById('titleInput').value.trim();
  const content = document.getElementById('body').value.trim();
  if (!title) { toast('Add a title first', 'err'); document.getElementById('titleInput').focus(); return; }
  if (!content) { toast('Write something first', 'err'); document.getElementById('body').focus(); return; }
  const btn = document.getElementById('pubBtn');
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const res = await api({ action: 'publish', title, content });
    if (!res.ok) { const d = await res.json().catch(()=>{}); throw new Error(d?.error || `Error ${res.status}`); }
    const issue = await res.json();
    toast('Published! ✓', 'ok');
    setTimeout(() => {
      if (confirm('Article is live! Open it on the site?')) window.open(`pb-article.html?id=${issue.number}`, '_blank');
      document.getElementById('titleInput').value = '';
      document.getElementById('body').value = '';
      renderPreview();
    }, 600);
  } catch(e) { toast(e.message, 'err'); }
  finally { btn.classList.remove('loading'); btn.disabled = false; }
}

// ── IMAGE UPLOAD ──────────────────────────────────────────────────────────────

async function uploadImg(input) {
  const file = input.files[0];
  if (!file) return;
  const btn = document.getElementById('imgBtn');
  btn.classList.add('uploading');
  try {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
    const res = await api({ action: 'upload', content: b64, filename: file.name });
    if (!res.ok) { const d = await res.json().catch(()=>{}); throw new Error(d?.error || `Error ${res.status}`); }
    const data = await res.json();
    const url = data.content?.download_url;
    if (!url) throw new Error('No URL in response');
    const ta = document.getElementById('body');
    ta.setRangeText(`\n![image](${url})\n`, ta.selectionStart, ta.selectionEnd, 'end');
    renderPreview();
    toast('Image uploaded ✓', 'ok');
  } catch(e) { toast(`Upload failed: ${e.message}`, 'err'); }
  finally { btn.classList.remove('uploading'); input.value = ''; }
}

// ── TOOLBAR ───────────────────────────────────────────────────────────────────

function wrap(a, b) {
  const ta = document.getElementById('body');
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.setRangeText(a + (ta.value.substring(s, e) || 'text') + b, s, e, 'end');
  ta.focus(); renderPreview();
}

function prefix(p) {
  const ta = document.getElementById('body');
  const pos = ta.selectionStart;
  ta.setRangeText((pos === 0 || ta.value[pos - 1] === '\n' ? '' : '\n') + p, pos, pos, 'end');
  ta.focus(); renderPreview();
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────

let prevOpen = true;
function togglePreview() {
  prevOpen = !prevOpen;
  document.getElementById('preview').classList.toggle('hidden', !prevOpen);
  document.getElementById('prevToggle').style.color = prevOpen ? 'var(--teal-b)' : '';
  if (prevOpen) renderPreview();
}

function renderPreview() {
  const title = document.getElementById('titleInput').value.trim();
  const el = document.getElementById('prevTitle');
  el.textContent = title || 'Article title…';
  el.classList.toggle('empty', !title);
  const md = document.getElementById('body').value;
  document.getElementById('prevBody').innerHTML = md.trim() ? mdToHtml(md) : '<p class="prev-empty">Start writing to see a preview…</p>';
}

function mdToHtml(md) {
  const lines = md.split('\n');
  const out = [];
  let ul = false, ol = false, code = false, buf = [];

  const close = () => { if (ul) { out.push('</ul>'); ul = false; } if (ol) { out.push('</ol>'); ol = false; } };
  const span = t => t
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  for (const raw of lines) {
    if (raw.startsWith('```')) { if (!code) { close(); code = true; buf = []; } else { code = false; out.push(`<pre><code>${buf.join('\n')}</code></pre>`); } continue; }
    if (code) { buf.push(esc(raw)); continue; }
    const e = esc(raw);
    if (!e.trim()) { close(); continue; }
    if (/^---+$/.test(raw)) { close(); out.push('<hr>'); }
    else if (/^&gt; /.test(e)) { close(); out.push(`<blockquote>${span(e.slice(5))}</blockquote>`); }
    else if (/^### /.test(raw)) { close(); out.push(`<h3>${span(e.slice(4))}</h3>`); }
    else if (/^## /.test(raw)) { close(); out.push(`<h2>${span(e.slice(3))}</h2>`); }
    else if (/^# /.test(raw)) { close(); out.push(`<h2>${span(e.slice(2))}</h2>`); }
    else if (/^[-*] /.test(raw)) { if (ol) { out.push('</ol>'); ol = false; } if (!ul) { out.push('<ul>'); ul = true; } out.push(`<li>${span(e.slice(2))}</li>`); }
    else if (/^\d+\. /.test(raw)) { if (ul) { out.push('</ul>'); ul = false; } if (!ol) { out.push('<ol>'); ol = true; } out.push(`<li>${span(e.replace(/^\d+\. /,''))}</li>`); }
    else { close(); out.push(`<p>${span(e)}</p>`); }
  }
  close();
  if (code) out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
  return out.join('\n');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

let toastT;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  if (pw()) { showEditor(); return; }
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
});
</script>
</body>
</html>
