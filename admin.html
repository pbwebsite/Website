<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write Article | PB Performance Coaching</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1c20;--surface:#121f25;--card:#182630;--card-h:#1d3039;
  --border:#25383f;--border-s:#2e4650;
  --teal:#3a8fa2;--teal-b:#4db8d0;--teal-d:#2D6E7E;
  --text:#dde8ea;--muted:#7dabb4;--dim:#3d6470;
  --danger:#e05252;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ── SETUP SCREEN ── */
.setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.setup.hidden{display:none}
.setup-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--teal);border-radius:16px;padding:2.8rem 2.4rem;width:100%;max-width:420px}
.setup-logo{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem}
.setup-logo img{width:40px;height:40px;border-radius:8px}
.setup-logo-name{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;line-height:1.1}
.setup-logo-sub{font-size:.55rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.setup-title{font-size:1.5rem;font-weight:900;letter-spacing:-.025em;margin-bottom:.4rem}
.setup-sub{font-size:.85rem;color:var(--muted);line-height:1.65;margin-bottom:1.8rem}
.setup-sub a{color:var(--teal-b);text-decoration:none}
.setup-sub a:hover{text-decoration:underline}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field label{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.field input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.92rem;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--teal)}
.setup-btn{width:100%;padding:.9rem;background:linear-gradient(135deg,#3e9db1,#25768a);color:#fff;font-size:.9rem;font-weight:800;letter-spacing:.04em;border:none;border-radius:8px;cursor:pointer;margin-top:.5rem;transition:background .2s}
.setup-btn:hover{background:linear-gradient(135deg,#52c1d8,#3a8fa2)}
.setup-error{font-size:.78rem;color:var(--danger);margin-top:.6rem;min-height:1.1em}

/* ── EDITOR LAYOUT ── */
.editor-shell{display:none;flex-direction:column;height:100vh}
.editor-shell.visible{display:flex}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.7rem 1.25rem;
  background:rgba(13,28,32,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;gap:1rem;
}
.topbar__left{display:flex;align-items:center;gap:1rem;min-width:0}
.topbar__logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text);flex-shrink:0}
.topbar__logo img{width:34px;height:34px;border-radius:6px}
.topbar__badge{font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-b);background:rgba(77,184,208,.1);border:1px solid rgba(77,184,208,.25);padding:.2rem .65rem;border-radius:20px;white-space:nowrap}
.topbar__right{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.topbar__view-site{font-size:.72rem;font-weight:700;color:var(--dim);text-decoration:none;transition:color .15s}
.topbar__view-site:hover{color:var(--muted)}
.topbar__logout{font-size:.72rem;font-weight:700;color:var(--dim);background:none;border:none;cursor:pointer;transition:color .15s;padding:0}
.topbar__logout:hover{color:var(--danger)}
.publish-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.52rem 1.3rem;
  background:linear-gradient(135deg,#3e9db1,#25768a);
  color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.06em;
  border:none;border-radius:7px;cursor:pointer;
  box-shadow:0 2px 10px rgba(58,143,162,.3);
  transition:background .2s,transform .15s,box-shadow .2s;
  white-space:nowrap;
}
.publish-btn:hover:not(:disabled){background:linear-gradient(135deg,#52c1d8,#3a8fa2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(58,143,162,.45)}
.publish-btn:disabled{opacity:.5;cursor:not-allowed}
.publish-btn--loading{position:relative;color:transparent}
.publish-btn--loading::after{content:'';position:absolute;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;top:50%;left:50%;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* TITLE BAR */
.title-bar{padding:.9rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.title-input{
  width:100%;background:none;border:none;outline:none;
  font-size:1.5rem;font-weight:900;letter-spacing:-.025em;color:var(--text);
  font-family:inherit;line-height:1.2;
}
.title-input::placeholder{color:var(--dim)}

/* TOOLBAR */
.toolbar{
  display:flex;align-items:center;gap:.2rem;padding:.5rem .9rem;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;flex-wrap:wrap;
}
.tb-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:28px;background:none;border:none;border-radius:5px;
  color:var(--muted);cursor:pointer;font-size:.75rem;font-weight:800;
  transition:color .15s,background .15s;
  font-family:inherit;
}
.tb-btn:hover{color:var(--text);background:rgba(255,255,255,.07)}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 .25rem;flex-shrink:0}
.tb-img-label{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:28px;background:none;border:none;border-radius:5px;
  color:var(--muted);cursor:pointer;transition:color .15s,background .15s;
}
.tb-img-label:hover{color:var(--text);background:rgba(255,255,255,.07)}
.tb-img-uploading{color:var(--teal-b)!important;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#imgInput{display:none}

/* EDITOR / PREVIEW SPLIT */
.editor-body{display:flex;flex:1;min-height:0}
.write-pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.write-pane.full{flex:1}
.preview-pane{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.preview-pane.hidden{display:none}

.body-textarea{
  flex:1;resize:none;width:100%;
  background:var(--bg);border:none;outline:none;
  color:var(--text);font-size:.95rem;font-family:'Helvetica Neue',Arial,sans-serif;
  line-height:1.85;padding:1.5rem;
  -webkit-font-smoothing:antialiased;
}
.body-textarea::placeholder{color:var(--dim)}

/* WYSIWYG PREVIEW — mirrors pb-article.html exactly */
.preview-article{padding:2rem 1.5rem 4rem;max-width:680px}
.preview-art-date{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:.75rem}
.preview-art-title{font-size:clamp(1.4rem,2.5vw,2rem);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.4rem;color:var(--text);text-wrap:balance}
.preview-art-title.empty{color:var(--dim);font-weight:500;font-style:italic;letter-spacing:0}
.preview-art-author{display:flex;align-items:center;gap:.9rem;margin-bottom:2rem;padding-bottom:1.8rem;border-bottom:1px solid var(--border)}
.preview-art-author img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--teal);filter:saturate(.88);flex-shrink:0}
.preview-art-author__name{font-size:.8rem;font-weight:800}
.preview-art-author__role{font-size:.6rem;color:var(--dim);margin-top:.1rem}
.art-body{font-size:1rem;color:var(--muted);line-height:1.85}
.art-body p{margin:.9rem 0}
.art-body h2{font-size:1.35rem;font-weight:900;color:var(--text);letter-spacing:-.025em;margin:2.2rem 0 .65rem;line-height:1.2}
.art-body h3{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.015em;margin:1.8rem 0 .5rem}
.art-body strong{color:var(--text);font-weight:700}
.art-body em{font-style:italic}
.art-body a{color:var(--teal-b);text-decoration:underline;text-underline-offset:3px}
.art-body ul,.art-body ol{padding-left:1.4rem;margin:.8rem 0;display:flex;flex-direction:column;gap:.35rem}
.art-body li{line-height:1.7}
.art-body blockquote{border-left:3px solid var(--teal);padding:.5rem 1.1rem;color:var(--muted);font-style:italic;margin:1.4rem 0;background:rgba(58,143,162,.05);border-radius:0 8px 8px 0}
.art-body hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
.art-body img{max-width:100%;border-radius:10px;margin:1.5rem 0;display:block}
.art-body pre{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:1.2rem;overflow-x:auto;margin:1.2rem 0;font-size:.84rem}
.art-body code{background:rgba(255,255,255,.06);padding:.15em .4em;border-radius:4px;font-size:.87em}
.art-body pre code{background:none;padding:0;font-size:inherit}
.preview-empty{color:var(--dim);font-size:.88rem;font-style:italic}

/* STATUS TOAST */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.75rem 1.4rem;font-size:.82rem;font-weight:700;color:var(--text);
  box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9999;
  transition:transform .3s var(--ease),opacity .3s;opacity:0;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast--success{border-color:rgba(58,143,162,.5);color:var(--teal-b)}
.toast--error{border-color:rgba(224,82,82,.4);color:var(--danger)}

/* MOBILE */
@media(max-width:640px){
  .preview-pane{display:none!important}
  .write-pane{border-right:none;flex:1}
  .title-input{font-size:1.2rem}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="setup" id="setup">
  <div class="setup-card">
    <div class="setup-logo">
      <img src="images/logo.jpg" alt="PB Performance Coaching">
      <div>
        <div class="setup-logo-name">PB Performance</div>
        <div class="setup-logo-sub">Article Editor</div>
      </div>
    </div>
    <h1 class="setup-title">Write an Article</h1>
    <p class="setup-sub">Enter your password to start writing.</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="setup-btn" onclick="checkPassword()">Sign In →</button>
    <p class="setup-error" id="setupError"></p>
  </div>
</div>

<!-- EDITOR -->
<div class="editor-shell" id="editorShell">

  <div class="topbar">
    <div class="topbar__left">
      <a class="topbar__logo" href="index.html" target="_blank">
        <img src="images/logo.jpg" alt="PB">
      </a>
      <span class="topbar__badge">Article Editor</span>
    </div>
    <div class="topbar__right">
      <a class="topbar__view-site" href="pb-articles.html" target="_blank">View Site</a>
      <button class="topbar__logout" onclick="logout()">Log out</button>
      <button class="publish-btn" id="publishBtn" onclick="publishArticle()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Publish Article
      </button>
    </div>
  </div>

  <div class="title-bar">
    <input class="title-input" id="titleInput" type="text" placeholder="Article title…" autocomplete="off" oninput="updatePreview()">
  </div>

  <div class="toolbar">
    <button class="tb-btn" title="Bold" onclick="wrap('**','**')"><strong>B</strong></button>
    <button class="tb-btn" title="Italic" onclick="wrap('*','*')"><em>I</em></button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Heading" onclick="insertLine('## ')">H2</button>
    <button class="tb-btn" title="Sub-heading" onclick="insertLine('### ')">H3</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Bullet list" onclick="insertLine('- ')">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="tb-btn" title="Quote" onclick="insertLine('> ')">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </button>
    <button class="tb-btn" title="Divider" onclick="insertLine('---')">—</button>
    <div class="tb-sep"></div>
    <label class="tb-img-label" id="imgLabel" title="Upload image">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <input type="file" id="imgInput" accept="image/*" onchange="uploadImage(this)">
    </label>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="previewToggle" title="Toggle preview" onclick="togglePreview()" style="width:auto;padding:0 .6rem;font-size:.65rem;letter-spacing:.06em;color:var(--teal-b)">Preview</button>
  </div>

  <div class="editor-body">
    <div class="write-pane" id="writePane">
      <textarea class="body-textarea" id="bodyTextarea"
        placeholder="Start writing your article here…&#10;&#10;Tip: use ## for headings, **bold**, *italic*, and paste images using the toolbar above."
        oninput="updatePreview()"
        spellcheck="true"></textarea>
    </div>
    <div class="preview-pane" id="previewPane">
      <div class="preview-article">
        <div class="preview-art-date">Draft preview</div>
        <div class="preview-art-title empty" id="previewTitle">Article title…</div>
        <div class="preview-art-author">
          <img src="images/paddy-bench.jpg" alt="Paddy Burke" onerror="this.style.display='none'">
          <div>
            <div class="preview-art-author__name">Paddy Burke</div>
            <div class="preview-art-author__role">MSc Performance Coaching · Antrim Senior Hurler</div>
          </div>
        </div>
        <div class="art-body" id="previewBody"><p class="preview-empty">Start writing to see a live preview…</p></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const REPO = 'pbwebsite/Website';
const LABEL = 'article';
const LS_AUTH = 'pb_admin_auth';

// ── PAT encrypted with AES-256-GCM — safe to commit ─────────────────────────
// Generate this blob by running in your browser console (on any page):
//   encryptForSetup('ghp_YOUR_PAT', 'paddys_password').then(console.log)
// Then paste the output below and commit.
const ENCRYPTED_PAT = 'REPLACE_WITH_ENCRYPTED_BLOB';
// ─────────────────────────────────────────────────────────────────────────────

// Developer helper — run once in console to generate ENCRYPTED_PAT
async function encryptForSetup(pat, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const km   = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt']
  );
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(pat));
  const out = new Uint8Array(16 + 12 + ct.byteLength);
  out.set(salt); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  return btoa(String.fromCharCode(...out));
}

async function decryptPAT(blob, password) {
  const data = Uint8Array.from(atob(blob), c => c.charCodeAt(0));
  const salt = data.slice(0, 16), iv = data.slice(16, 28), ct = data.slice(28);
  const enc  = new TextEncoder();
  const km   = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

function getToken() { return sessionStorage.getItem('pb_pat') || ''; }

async function checkPassword() {
  const pwd = document.getElementById('passwordInput').value;
  if (!pwd) { showError('Please enter your password.'); return; }
  const btn = document.querySelector('.setup-btn');
  btn.textContent = 'Checking…'; btn.disabled = true;
  try {
    const token = await decryptPAT(ENCRYPTED_PAT, pwd);
    sessionStorage.setItem('pb_pat', token);
    showEditor();
  } catch(e) {
    showError('Incorrect password — try again.');
  } finally {
    btn.textContent = 'Sign In →'; btn.disabled = false;
  }
}

function logout() {
  if (!confirm('Log out?')) return;
  sessionStorage.removeItem('pb_pat');
  location.reload();
}

function showEditor() {
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('editorShell').classList.add('visible');
  document.getElementById('titleInput').focus();
  ensureLabel();
}

function showError(msg) {
  document.getElementById('setupError').textContent = msg;
}

function showUploadError(msg) {
  console.error('[Admin] Upload error:', msg);
  // Show error in a persistent banner above the toolbar
  let banner = document.getElementById('uploadErrorBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'uploadErrorBanner';
    banner.style.cssText = 'background:rgba(224,82,82,.12);border-bottom:1px solid rgba(224,82,82,.3);color:#e05252;font-size:.75rem;font-weight:700;padding:.55rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0';
    const toolbar = document.querySelector('.toolbar');
    toolbar.parentNode.insertBefore(banner, toolbar);
  }
  banner.innerHTML = `<span>⚠ ${msg}</span><button onclick="this.parentNode.remove()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0">✕</button>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('pb_pat')) { showEditor(); return; }
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });
});

// ── TOOLBAR HELPERS ───────────────────────────────────────────────────────────

function wrap(before, after) {
  const ta = document.getElementById('bodyTextarea');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || 'text';
  const replacement = before + sel + after;
  ta.setRangeText(replacement, start, end, 'end');
  ta.focus();
  updatePreview();
}

function insertLine(prefix) {
  const ta = document.getElementById('bodyTextarea');
  const pos = ta.selectionStart;
  const before = ta.value.lastIndexOf('\n', pos - 1) + 1;
  const lineStart = ta.value.substring(before, pos);
  const insertion = (pos === 0 || ta.value[pos-1] === '\n' ? '' : '\n') + prefix;
  ta.setRangeText(insertion, pos, pos, 'end');
  ta.focus();
  updatePreview();
}

// ── IMAGE UPLOAD ──────────────────────────────────────────────────────────────

async function uploadImage(input) {
  const file = input.files[0];
  if (!file) return;
  const label = document.getElementById('imgLabel');
  label.classList.add('tb-img-uploading');

  try {
    const base64 = await toBase64(file);
    const name = `articles/${Date.now()}-${file.name.replace(/[^a-z0-9.]/gi, '-').toLowerCase()}`;
    const res = await ghFetch(
      `https://api.github.com/repos/${REPO}/contents/images/${name}`,
      getToken(),
      'PUT',
      { message: `Upload image: ${file.name}`, content: base64.split(',')[1] }
    );
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const d = await res.json(); if (d.message) msg = d.message; } catch(_) {}
      if (res.status === 404) msg = 'No repo write access — token must be from a GitHub account with write access to pbwebsite/Website';
      if (res.status === 401) msg = 'Invalid token — log out and re-enter your GitHub token';
      if (res.status === 403) msg = 'Token needs "repo" scope — log out and generate a new token';
      throw new Error(msg);
    }
    const data = await res.json();
    const url = data.content?.download_url;
    if (!url) throw new Error('No download URL in response');
    const md = `![image](${url})`;
    const ta = document.getElementById('bodyTextarea');
    const pos = ta.selectionStart;
    ta.setRangeText('\n' + md + '\n', pos, pos, 'end');
    updatePreview();
    toast('Image uploaded ✓', 'success');
  } catch(e) {
    console.error('[Admin] Image upload failed:', e.message);
    showUploadError(e.message);
  } finally {
    label.classList.remove('tb-img-uploading');
    input.value = '';
  }
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── PUBLISH ───────────────────────────────────────────────────────────────────

async function publishArticle() {
  const title = document.getElementById('titleInput').value.trim();
  const body = document.getElementById('bodyTextarea').value.trim();
  if (!title) { toast('Please add a title first', 'error'); document.getElementById('titleInput').focus(); return; }
  if (!body) { toast('Please write something first', 'error'); document.getElementById('bodyTextarea').focus(); return; }

  const btn = document.getElementById('publishBtn');
  btn.classList.add('publish-btn--loading');
  btn.disabled = true;

  try {
    const res = await ghFetch(
      `https://api.github.com/repos/${REPO}/issues`,
      getToken(), 'POST',
      { title, body, labels: [LABEL] }
    );
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const d = await res.json(); if (d.message) msg = d.message; } catch(_) {}
      if (res.status === 404) msg = 'No write access — log out and use a token from an account with write access to pbwebsite/Website';
      if (res.status === 401) msg = 'Invalid or expired token — log out and re-enter your GitHub token';
      throw new Error(msg);
    }
    const issue = await res.json();

    toast('Article published! ✓', 'success');
    setTimeout(() => {
      if (confirm('Article is live!\n\nOpen it on the site?')) {
        window.open(`pb-article.html?id=${issue.number}`, '_blank');
      }
      document.getElementById('titleInput').value = '';
      document.getElementById('bodyTextarea').value = '';
      updatePreview();
    }, 800);
  } catch(e) {
    toast(`Publish failed: ${e.message}`, 'error');
  } finally {
    btn.classList.remove('publish-btn--loading');
    btn.disabled = false;
  }
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────

let previewOpen = true;

function togglePreview() {
  previewOpen = !previewOpen;
  const pane = document.getElementById('previewPane');
  const btn = document.getElementById('previewToggle');
  pane.classList.toggle('hidden', !previewOpen);
  btn.style.color = previewOpen ? 'var(--teal-b)' : '';
  if (previewOpen) updatePreview();
}

function updatePreview() {
  const titleEl = document.getElementById('previewTitle');
  const title = document.getElementById('titleInput').value.trim();
  if (title) {
    titleEl.textContent = title;
    titleEl.classList.remove('empty');
  } else {
    titleEl.textContent = 'Article title…';
    titleEl.classList.add('empty');
  }

  const body = document.getElementById('bodyTextarea').value;
  document.getElementById('previewBody').innerHTML = body.trim()
    ? parseMarkdown(body)
    : '<p class="preview-empty">Start writing to see a live preview…</p>';
}

function parseMarkdown(md) {
  if (!md) return '<p style="color:var(--dim)">Nothing to preview yet.</p>';
  const lines = md.split('\n');
  const out = [];
  let inUl=false, inOl=false, inCode=false, codeBuf=[];

  function closeList(){
    if(inUl){out.push('</ul>');inUl=false;}
    if(inOl){out.push('</ol>');inOl=false;}
  }

  function inline(t){
    return t
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
      .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }

  for(let i=0;i<lines.length;i++){
    const raw=lines[i];
    if(raw.startsWith('```')){
      if(!inCode){closeList();inCode=true;codeBuf=[];}
      else{inCode=false;out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`);}
      continue;
    }
    if(inCode){codeBuf.push(raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));continue;}
    const e=raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(e.trim()===''){closeList();continue;}
    if(/^---+$/.test(raw)){closeList();out.push('<hr>');continue;}
    if(/^&gt; /.test(e)){closeList();out.push(`<blockquote>${inline(e.replace(/^&gt; /,''))}</blockquote>`);}
    else if(/^### /.test(raw)){closeList();out.push(`<h3>${inline(e.replace(/^### /,''))}</h3>`);}
    else if(/^## /.test(raw)){closeList();out.push(`<h2>${inline(e.replace(/^## /,''))}</h2>`);}
    else if(/^# /.test(raw)){closeList();out.push(`<h2>${inline(e.replace(/^# /,''))}</h2>`);}
    else if(/^[-*] /.test(raw)){if(inOl){out.push('</ol>');inOl=false;}if(!inUl){out.push('<ul>');inUl=true;}out.push(`<li>${inline(e.replace(/^[-*] /,''))}</li>`);}
    else if(/^\d+\. /.test(raw)){if(inUl){out.push('</ul>');inUl=false;}if(!inOl){out.push('<ol>');inOl=true;}out.push(`<li>${inline(e.replace(/^\d+\. /,''))}</li>`);}
    else{closeList();out.push(`<p>${inline(e)}</p>`);}
  }
  closeList();
  if(inCode)out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`);
  return out.join('\n');
}

// ── GITHUB FETCH ──────────────────────────────────────────────────────────────

async function ghFetch(url, token, method='GET', body=null) {
  const opts = {
    method,
    headers: {
      'Authorization': `token ${token || getToken()}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts);
}

async function ensureLabel() {
  try {
    const res = await ghFetch(`https://api.github.com/repos/${REPO}/labels/${LABEL}`);
    if (res.status === 404) {
      await ghFetch(`https://api.github.com/repos/${REPO}/labels`, getToken(), 'POST', {
        name: LABEL, color: '3a8fa2', description: 'Published article'
      });
    }
  } catch(_) {}
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast toast--${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3200);
}
</script>
